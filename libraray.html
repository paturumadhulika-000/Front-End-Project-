<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>
<body>

<h2>Library Book Management</h2>

<button onclick="getBooks()">GET Books</button>
<button onclick="addBook()">POST Book</button>
<button onclick="updateBook()">PUT Book</button>
<button onclick="deleteBook()">DELETE Book</button>

<h3>Output:</h3>
<p id="output"></p>

<script>

    // GET Books
    function getBooks() {

        document.getElementById("output").innerHTML =

        "<h3>Book List</h3>" +

        "1. Book: Harry Potter <br>" +
        "Author: J.K. Rowling <br>" +
        "Price: 500 <br><br>" +

        "2. Book: Wings of Fire <br>" +
        "Author: A.P.J Abdul Kalam <br>" +
        "Price: 350";
    }


    // POST Add New Book
    function addBook() {

        document.getElementById("output").innerHTML =

        "<h3>Updated Book List</h3>" +

        "1. Book: Harry Potter <br>" +
        "Author: J.K. Rowling <br>" +
        "Price: 500 <br><br>" +

        "2. Book: Wings of Fire <br>" +
        "Author: A.P.J Abdul Kalam <br>" +
        "Price: 350 <br><br>" +

        "3. Book: Rich Dad Poor Dad <br>" +
        "Author: Robert Kiyosaki <br>" +
        "Price: 450";
    }


    // PUT Update Book Details
    function updateBook() {

        document.getElementById("output").innerHTML =

        "<h3>Updated Book Details</h3>" +

        "1. Book: Harry Potter and the Chamber of Secrets <br>" +
        "Author: J.K. Rowling <br>" +
        "Price: 650 <br><br>" +

        "2. Book: Wings of Fire <br>" +
        "Author: A.P.J Abdul Kalam <br>" +
        "Price: 350 <br><br>" +

        "3. Book: Rich Dad Poor Dad <br>" +
        "Author: Robert Kiyosaki <br>" +
        "Price: 450";
    }


    // DELETE Book
    function deleteBook() {

        document.getElementById("output").innerHTML =

        "<h3>Book List After Delete</h3>" +

        "1. Book: Harry Potter and the Chamber of Secrets <br>" +
        "Author: J.K. Rowling <br>" +
        "Price: 650 <br><br>" +

        "2. Book: Rich Dad Poor Dad <br>" +
        "Author: Robert Kiyosaki <br>" +
        "Price: 450";
    }

</script>

</body>
</html>
