<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>
<body>

<h2>Employee Management System</h2>

<button onclick="getEmployee()">GET</button>
<button onclick="addEmployee()">POST</button>
<button onclick="updateEmployee()">PUT</button>
<button onclick="deleteEmployee()">DELETE</button>

<h3>Output:</h3>
<p id="output"></p>

<script>

    // GET Employee Details
    function getEmployee() {

        document.getElementById("output").innerHTML =

        "<h3>Employee List</h3>" +

        "1. Name: renuka <br>" +
        "Salary: 50000 <br>" +
        "Email: renuka@gmail.com <br><br>" +

        "2. Name: sameera <br>" +
        "Salary: 45000 <br>" +
        "Email: sameera@gmail.com";
    }


    // POST Add New Employee
    function addEmployee() {

        document.getElementById("output").innerHTML =

        "<h3>Updated Employee List</h3>" +

        "1. Name: renuka <br>" +
        "Salary: 50000 <br>" +
        "Email: renuka@gmail.com <br><br>" +

        "2. Name: sameera <br>" +
        "Salary: 45000 <br>" +
        "Email: sameera@gmail.com <br><br>" +

        "3. Name: madhulika <br>" +
        "Salary: 55000 <br>" +
        "Email: madhulika@gmail.com";
    }


    // PUT Update Employee Details
    function updateEmployee() {

        "<h3>Updated Employee Details</h3>" +

        "1. Name: Renuka <br>" +
        "Salary: 60000 <br>" +

        "2. Name: sameera<br>" +
        "Salary: 45000 <br>" +
        "Email: sameera@gmail.com <br><br>" +

        "3. Name: madhulika <br>" +
        "Salary: 55000 <br>" +
        "Email: madhulika@gmail.com";
    }


    // DELETE Employee
    function deleteEmployee() {

        document.getElementById("output").innerHTML =

        "<h3>Employee List After Delete</h3>" +

        "1. Name: Renuka <br>" +
        "Salary: 60000 <br>" +
        "Email: renuka123@gmail.com <br><br>" +

        "2. Name: madhulika <br>" +
        "Salary: 55000 <br>" +
        "Email: madhulika@gmail.com";
    }

</script>

</body>
</html>
